id: "lab-11"
slug: "lab-11-pki-ca-trust"
title: "Local CA Trust and Nginx TLS"
distro_name: "lplab-11"
base_image: "ubuntu-24.04"
student_user: "sysadmin"
difficulty: "intermediate"
estimated_minutes: 30
xk0_006_domains:
  - "security"
  - "services_and_users"
  - "troubleshooting"
objectives:
  - "Set /etc/ssl/lab-portal/portal.key mode 0600 and sign portal.crt with /etc/lab-ca/ca.crt"
  - "Include SAN DNS:portal.lab.internal in /etc/ssl/lab-portal/portal.crt"
  - "Install /etc/lab-ca/ca.crt to /usr/local/share/ca-certificates/lab-ca.crt, run update-ca-certificates, and reload nginx"
  - "Verify curl https://portal.lab.internal:18450/ succeeds without -k and returns trusted"
